name: Add Token
description: token add request
title: '[AddToken] `SYMBOL` to `NETWORK`'
labels: [addToken]
body:
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [MAINNET, GNOSIS_CHAIN]
  - type: input
    id: symbol
    attributes:
      label: Token Symbol
  - type: input
    id: address
    attributes:
      label: Address
  - type: textarea
    id: reason
    attributes:
      label: Reason
